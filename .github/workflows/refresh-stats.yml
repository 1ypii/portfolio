name: refresh stats

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-stats

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: refresh and push if needed
        run: |
          node .github/refresh-stats.js
          git diff --quiet games-data.js && exit 0
          git config user.name "zxaw"
          git config user.email "128241871+1ypii@users.noreply.github.com"
          git add games-data.js
          git commit --amend --allow-empty-message -m ""
          git push --force
